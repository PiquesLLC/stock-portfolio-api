[phases.setup]
# postgresql gives us pg_dump on PATH for the off-site backup shipper
# (src/services/offsite-backup.service.ts). The Postgres server itself
# isn't started — we only need the client tools.
nixPkgs = ["nodejs_22", "npm-10_x", "openssl", "fontconfig", "freefont_ttf", "postgresql"]
nixpkgsArchive = "51ad838b03a05b1de6f9f2a0fffecee64a9788ee"

# Override the install phase to use `npm install` rather than `npm ci`.
# Background: npm 11 (local dev) generates lockfiles that omit certain
# optional-peer-dep entries (e.g. `c12`'s optional peer on
# `magicast@^0.3.5`). npm 10 (Railway's nixpacks) strict-checks the
# lockfile and fails with "Missing: magicast@0.3.5 from lock file". Until
# nixpacks ships an npm 11 package — or until the upstream npm CLI
# normalizes lockfile generation across major versions — `npm install`
# bypasses the strict check while still respecting the lockfile for
# resolved versions.
[phases.install]
# M-1: `--no-audit` removed so known-vulnerable dependencies are printed in the
# Railway build log. It is only a report — `npm audit` during install never fails
# the build — but it restores the signal that would otherwise go unseen until
# someone runs the audit by hand. (The 2026-08-23 review found 35 advisories in
# the production tree, 17 high, with nothing surfacing them.)
#
# NOT changed here, deliberately: `npm install` → `npm ci`. `npm ci` is the
# correct command (it fails loudly on lockfile drift instead of silently
# re-resolving), but the comment above explains why it currently fails on
# Railway's npm 10, and swapping it blind would break deploys. Fix the lockfile
# generation first — regenerate with npm 10, or pin npm via `engines` — verify a
# build, THEN switch. Until then this stays a known gap, not a silent one.
cmds = ["npm install --include=dev --no-fund"]
